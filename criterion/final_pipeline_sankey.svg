<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1100" viewBox="0 0 2400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Final Pipeline Sankey</title>
  <desc id="desc">High-level Sankey diagram of the Criterion cleaning pipeline from current titles to final verified feature-length movies.</desc>
  <style>
    .bg { fill: #faf7f2; }
    .node { rx: 6; ry: 6; stroke: rgba(0,0,0,0.12); stroke-width: 1; }
    .label { font: 700 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
    .small { font: 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #404040; }
    .title { font: 700 32px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .subtitle { font: 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    .flow { fill-opacity: 0.45; stroke: none; }
    .leader { stroke: rgba(0,0,0,0.35); stroke-width: 1.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="2400" height="1100" />

  <text class="title" x="40" y="56">Final Pipeline Sankey</text>
  <text class="subtitle" x="40" y="84">Broad cleaning stages only. Labels show counts at each stage; collection expansion increases row counts because one collection can unpack into multiple title rows.</text>

